# Torch — three containers that work together:
#   db    → Postgres + pgvector
#   web   → user-facing app (APP_ROLE=web,  port 3000)
#   admin → admin dashboards + observability + ingest (APP_ROLE=admin, port 3001)
# A one-shot `migrate` job applies schema before the apps start.
#
# Build-time: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is inlined into the client bundle,
# so provide it for interpolation (shell env or a `.env` file next to this one).
# Runtime secrets (CLERK_SECRET_KEY, OPENAI_API_KEY, …) come from `.env.local`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: torch
      POSTGRES_PASSWORD: torch
      POSTGRES_DB: torch
    ports:
      - "5432:5432"
    volumes:
      - torch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torch -d torch"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    entrypoint: ["node", "scripts/db-migrate.mjs"]
    command: []
    environment:
      DATABASE_URL: postgres://torch:torch@db:5432/torch
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    env_file:
      - .env.local
    environment:
      APP_ROLE: web
      DATABASE_URL: postgres://torch:torch@db:5432/torch
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    env_file:
      - .env.local
    environment:
      APP_ROLE: admin
      DATABASE_URL: postgres://torch:torch@db:5432/torch
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  torch_pgdata:
