name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the `packageManager` field from package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Clerk requires a public key at build time; supply a placeholder so
          # the build does not fail in CI where the real key is not available.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
